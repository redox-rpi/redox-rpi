# Experiment desktop: Orbital with the COSMIC text editor and file manager
# in the image, but not started at boot. The text console comes up as
# without it; the command `desktop` starts Orbital on VT 3 for the user who
# is logged in, without a second login, and switches to it. Super+F2 goes
# back to the console, Super+F3 to the desktop again; "Quit desktop" in the
# launcher ends it and the console takes the display back (#805). Build
# after rpi-fb, orbital, orbital-apps and cosmic-apps-source.

# `desktop` looks for Orbital with grep. Upstream extrautils dropped grep
# (its build of 2026-11-18, source f5e8626a); uutils-grep has it now.
[packages]
uutils-grep = {}
# Runs the session as the user who typed `desktop` (tools/desktop-runas).
desktop-runas = "source"
# Orbital from source with the end-with-session patch
# (recipes/gui/orbital/).
orbital = "source"

# Experiment orbital starts Orbital at boot and stays on its VT: undo both.
[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
"""

[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = """
inputd -A 2
"""

# Shown by login after every login on the console (userutils prints
# /etc/motd); the image without this experiment has no motd.
[[files]]
path = "/etc/motd"
data = """
Type `desktop` to start the graphical desktop (beta).

"""

[[files]]
path = "/usr/bin/desktop"
mode = 0o755
data = """
#!/usr/bin/ion
# Starts the desktop (Orbital) from the text console for the user who is
# logged in, or switches to it when it already runs (#805). Orbital needs
# root: a user's `desktop` runs itself again through sudo with --user.
# Orbital then starts the session through desktop-runas as that user, so
# there is no second login. "Quit desktop" in the launcher ends the session,
# Orbital ends with it (ORBITAL_EXIT_WITH_SESSION) and the console comes
# back. It shows /usr/share/desktop/info.txt first, here and after the start
# in a window (desktop-session). --yes is still accepted, it changes nothing.
let who = $USER
let next_is_user = 0
let skip = 1
for arg in @args
    if test $skip = 1
        let skip = 0
    else if test $next_is_user = 1
        let who = $arg
        let next_is_user = 0
    else if test $arg = --user
        let next_is_user = 1
    else if test $arg != --yes && test $arg != -y
        echo "usage: desktop"
        exit 2
    end
end
if test "$USER" != root
    exec sudo /usr/bin/desktop --user $USER
end
# Whether Orbital runs, from ps (test -e cannot stat its scheme). ion's
# own $find looks for it in ps's output, so the image needs no grep.
fn orbital_runs
    let list = $(ps)
    test $find($list, /usr/bin/orbital) -ge 0
end
if not orbital_runs
    cat /usr/share/desktop/info.txt
    echo "desktop: starting Orbital for $who, its log goes to /tmp/desktop.log"
    export VT=3
    export ORBITAL_EXIT_WITH_SESSION=1
    # &! runs it in the background, disowned: else ion waits for it before
    # this script ends.
    orbital /usr/bin/desktop-runas $who /usr/bin/desktop-session &> /tmp/desktop.log &!
    # Wait up to 30 s for it (ion has no `while not`).
    let tries = 0
    while test $tries -lt 30
        if orbital_runs
            break
        end
        sleep 1
        let tries += 1
    end
    if not orbital_runs
        echo "desktop: Orbital did not start, see /tmp/desktop.log"
        exit 1
    end
end
inputd -A 3
echo "desktop: Super+F2 goes back to the console, Super+F3 to the desktop"
"""

# "Quit desktop" in the launcher (#805): ends the session's launcher; the
# session (desktop-session) then ends, and Orbital with it. The programs
# still open on the desktop are ended first, so none is left behind.
[[files]]
path = "/usr/share/ui/apps/zz_quit-desktop"
data = """
name=Quit desktop
binary=/usr/bin/desktop-quit
icon=/usr/share/icons/actions/system-log-out.png
author=redox-rpi
description=End the desktop and go back to the text console
"""

[[files]]
path = "/usr/bin/desktop-quit"
mode = 0o755
data = """
#!/usr/bin/ion
# Ends the desktop session of this user (#805): the desktop's programs
# first, then the launcher, which ends desktop-session and with it Orbital,
# then back to the text console. pkill -x matches the full path on Redox.
for prog in [cosmic-files cosmic-edit orbterm desktop-welcome sopwith viewer editor calculator]
    pkill -x /usr/bin/$prog
end
pkill -x /usr/bin/launcher
inputd -A 2
"""

# What the desktop is and how to get back, shown by desktop on the console
# and in a window after the login (desktop-welcome).
[[files]]
path = "/usr/share/desktop/info.txt"
data = """
Redox desktop (beta)

  Super+F2   back to the text console
  Super+F3   back to the desktop
             (or type desktop on the console)
  Super+T    a terminal
  Quit desktop (launcher menu): back to the
             console, the desktop ends

Known limits:
- Slow: everything draws in software; dragging a
  window costs much of a core.
- Quit desktop (in the launcher menu) ends it and
  gives its memory back.
- No browser, one screen resolution, no HDMI hotplug.

"""

# The session orblogin starts after the login: the launcher, then the info
# window (the session ends when the launcher does). The launcher comes
# first (#449): Orbital sends Super+key to the window it made first, and the
# launcher handles Super+T; the info window, made a second later, is the
# newest and has the focus, so Enter reaches it.
[[files]]
path = "/usr/bin/desktop-session"
mode = 0o755
data = """
#!/usr/bin/ion
launcher &
sleep 1
orbterm /usr/bin/desktop-welcome &!
wait
"""

[[files]]
path = "/usr/bin/desktop-welcome"
mode = 0o755
data = """
#!/usr/bin/ion
# clear: orbterm leaves a relibc log line at the top.
clear
cat /usr/share/desktop/info.txt
echo "Press Enter to close this window."
# head reads the line without echoing a variable name, as ion's read does.
head -n 1 > /dev/null
"""
