[packages]
timesync = "source"

# Named 65 so that it starts after 60_data.service (network-boot image),
# which mounts /scheme/data with the saved time. It sets the clock from the
# build or saved time at once and waits for the network itself.
[[files]]
path = "/usr/lib/init.d/65_timesync.service"
data = """
[unit]
description = "Set the clock from the saved time and an NTP server"
requires_weak = ["00_base.target"]

[service]
cmd = "timesync"
args = ["-d"]
type = "oneshot_async"
"""
