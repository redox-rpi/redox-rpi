# Experiment present-damage: the recipe of frame-diag (cosmic-apps-source
# plus softbuffer timing output) plus iced passing the damaged area to
# Orbital. Select it after cosmic-apps-source and frame-diag.
[source]
git = "https://github.com/pop-os/cosmic-edit.git"
# The commit of upstream's binary package (repo cosmic-edit.toml).
rev = "9dbaea370cb9f6373338c87125d03bb3e92fa589"

[build]
template = "custom"
dependencies = [
    "libonig",
]
script = """
DYNAMIC_INIT
# redox-rpi (experiment cosmic-apps-source): freedesktop-icons with our patch,
# given to cargo as a [patch] in --config, so the app source stays as pinned.
FDI="${COOKBOOK_BUILD}/freedesktop-icons"
rm -rf "${FDI}"
git clone -q https://github.com/pop-os/freedesktop-icons.git "${FDI}"
git -C "${FDI}" checkout -q ab4c57b8e416c6af9297cb04d101889896fd9a92
git -C "${FDI}" apply "${COOKBOOK_ROOT}/../../patches/experiments/cosmic-apps-source/freedesktop-icons-0001-keep-index-theme-in-memory-remember-missing-icons.patch"
FDI_PATCH="patch.\\\"https://github.com/pop-os/freedesktop-icons\\\".cosmic-freedesktop-icons.path=\\\"${FDI}\\\""
export RUSTONIG_DYNAMIC_LIBONIG=1
# redox-rpi (experiment frame-diag): softbuffer with timing output.
SB="${COOKBOOK_BUILD}/softbuffer"
rm -rf "${SB}"
git clone -q https://github.com/pop-os/softbuffer.git "${SB}"
git -C "${SB}" checkout -q c2b2c19ddb38ff17495643699f97cb1f2064a1be
git -C "${SB}" apply "${COOKBOOK_ROOT}/../../patches/experiments/frame-diag/softbuffer-0001-orbital-frame-diag.patch"
SB_PATCH="patch.\\\"https://github.com/pop-os/softbuffer\\\".softbuffer.path=\\\"${SB}\\\""
# redox-rpi (experiment present-damage): libcosmic with its iced, whose
# tiny-skia compositor passes the damaged area on to Orbital. Every crate
# cosmic-edit takes from the libcosmic repo is patched, so none is doubled.
LC="${COOKBOOK_BUILD}/libcosmic"
rm -rf "${LC}"
git clone -q https://github.com/pop-os/libcosmic.git "${LC}"
git -C "${LC}" checkout -q 60ad2cc4c33d7500aba557cd9150e6938d72d5a1
git -C "${LC}" submodule -q update --init iced
git -C "${LC}/iced" apply "${COOKBOOK_ROOT}/../../patches/experiments/present-damage/iced-0001-tiny-skia-pass-damage-to-present.patch"
LC_PATCH=()
for c in libcosmic:. cosmic-config:cosmic-config cosmic-config-derive:cosmic-config-derive cosmic-theme:cosmic-theme iced:iced build_helpers:iced/build_helpers iced_accessibility:iced/accessibility iced_core:iced/core iced_debug:iced/debug iced_futures:iced/futures iced_graphics:iced/graphics iced_program:iced/program iced_renderer:iced/renderer iced_runtime:iced/runtime iced_tiny_skia:iced/tiny_skia iced_wgpu:iced/wgpu iced_widget:iced/widget iced_winit:iced/winit; do
    LC_PATCH+=(--config "patch.\\\"https://github.com/pop-os/libcosmic.git\\\".${c%%:*}.path=\\\"${LC}/${c#*:}\\\"")
done
cookbook_cargo --no-default-features --config "${FDI_PATCH}" --config "${SB_PATCH}" "${LC_PATCH[@]}"

mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui/apps"
cp -v "${COOKBOOK_RECIPE}/manifest" "${COOKBOOK_STAGE}/usr/share/ui/apps/30_cosmic-edit"
#TODO: install with just?
APPID="com.system76.CosmicEdit"
mkdir -pv "${COOKBOOK_STAGE}/usr/share/applications/"
cp -v "${COOKBOOK_SOURCE}/res/${APPID}.desktop" "${COOKBOOK_STAGE}/usr/share/applications/"
mkdir -pv "${COOKBOOK_STAGE}/usr/share/metainfo/"
cp -v "${COOKBOOK_SOURCE}/res/${APPID}.metainfo.xml" "${COOKBOOK_STAGE}/usr/share/metainfo/"
mkdir -pv "${COOKBOOK_STAGE}/usr/share/icons/"
cp -rv "${COOKBOOK_SOURCE}/res/icons/hicolor/" "${COOKBOOK_STAGE}/usr/share/icons/"
"""

[package]
dependencies = [
    "libxkbcommon",
]