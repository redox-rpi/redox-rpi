# Demo: timerd publishes the temperature and uptime to an MQTT broker every
# minute. Use with --experiment timesync --experiment timerd --experiment
# mqtt. The broker is in /etc/mqtt-host: 10.0.2.2, the build host as QEMU's
# user network sees it. On a Pi: echo <broker> > /etc/mqtt-host

[[files]]
path = "/etc/mqtt-host"
data = """
10.0.2.2
"""

[[files]]
path = "/etc/timer.d/mqtt-temperature.toml"
data = """
[timer]
description = "MQTT demo: SoC temperature (m°C) every minute"
schedule = "* * * * *"

[service]
cmd = "mqtt-pub"
args = ["-t", "redox-rpi/temperature", "-f", "/scheme/rpi-firmware/temperature"]
"""

[[files]]
path = "/etc/timer.d/mqtt-uptime.toml"
data = """
[timer]
description = "MQTT demo: uptime every minute"
schedule = "* * * * *"

[service]
cmd = "ion"
args = ["-c", "mqtt-pub -t redox-rpi/uptime -m \\"$(uptime)\\""]
"""
