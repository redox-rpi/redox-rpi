# Experiment v3dd (#598, test only): starts vc4d's v3dd at boot, the V3D
# daemon (power, MMU, BOs, jobs) behind /scheme/v3d. Pi 4/400 only; v3dd
# leaves V3D alone on other boards. Needs v3d-power.

[packages]
vc4d = "source"

[[files]]
path = "/usr/lib/init.d/16_v3dd.service"
data = """
[unit]
description = "V3D 4.2 daemon (v3dd): power, MMU, buffer objects, jobs"
condition_architecture = ["aarch64"]

[service]
cmd = "v3dd"
type = { scheme = "v3d" }
"""
