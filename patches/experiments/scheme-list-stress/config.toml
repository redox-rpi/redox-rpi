# Test only, never in a release: 16 ramfs instances start without waiting
# (oneshot_async) right before netstack, so schemes are registered while
# netstack lists /scheme for its network adapter, as sudo's scheme is in a
# normal boot. Without ns-list-snapshot netstack then often finds no
# network.* scheme. See ../ns-list-snapshot/README.md.

[[files]]
path = "/usr/lib/init.d/09_list-stress-01.service"
data = """
[unit]
description = "Scheme list stress 01 (test)"

[service]
cmd = "/scheme/initfs/bin/ramfs"
args = ["liststress01"]
type = "oneshot_async"
"""

