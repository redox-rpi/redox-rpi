# Test only, never in a release. After the network is up, a unit started by
# init (so in init's namespace, where netstack and the drivers are) starts
# 40 ramfs instances, one by one, each registering a scheme, and lists
# /scheme five times after each. Every listing must contain the network
# scheme once. Results: /tmp/list-test.out (one count per listing, 200
# lines) and /tmp/list-test.done. scripts/test-scheme-list.sh reads them.
# See ../ns-list-snapshot/README.md.

[[files]]
path = "/usr/lib/init.d/95_list-stress.service"
data = """
[unit]
description = "Scheme list stress (test)"
requires_weak = ["10_net.target"]

[service]
cmd = "ion"
args = ["/usr/lib/list-stress.ion"]
type = "oneshot_async"
"""

[[files]]
path = "/usr/lib/list-stress.ion"
data = """
rm -f /tmp/list-test.out /tmp/list-test.done
for i in 1..=40
    /scheme/initfs/bin/ramfs liststress$i &
    for j in 1..=5
        ls /scheme | grep -c network >> /tmp/list-test.out
    end
end
ls /scheme | grep -c liststress > /tmp/list-test.done
"""
