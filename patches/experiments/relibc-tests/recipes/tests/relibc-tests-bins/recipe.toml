# Upstream's recipes/tests/relibc-tests-bins, changed so that the tests link
# the relibc of this build instead of the toolchain's prebuilt libc.a (#13):
# relibc is a build dependency, and the compiler looks for libc.a, libc.so
# and crt*.o in the recipe's sysroot first (-B, -L). The headers still come
# from the toolchain. build-image.sh builds this recipe from scratch.
[source]
same_as = "../../core/relibc"

[build]
template = "custom"
dependencies = ["relibc"]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./

make install-tests DESTDIR="${COOKBOOK_STAGE}/usr/share" NATIVE_LIBC=1 IS_REDOX=1 \
    CC="${GNU_TARGET}-gcc -B${COOKBOOK_SYSROOT}/lib/ -L${COOKBOOK_SYSROOT}/lib"

if [ -n "$TESTBIN" ]; then
"${COOKBOOK_REDOXER}" write-exec sh -c "cd /usr/share/relibc-tests; make run-once TESTBIN=bins_dynamic/$TESTBIN"
fi

# Create runner script
mkdir -p "${COOKBOOK_STAGE}/usr/bin"
cat > "${COOKBOOK_STAGE}/usr/bin/relibc-tests-runner" <<EOF
#!/usr/bin/env bash
set -e
cd /usr/share/relibc-tests
make run IS_REDOX=1 # FIXME use a user writable dir as build dir
EOF

chmod +x "${COOKBOOK_STAGE}/usr/bin/relibc-tests-runner"

"""

[package]
dependencies = ["gnu-make"]
