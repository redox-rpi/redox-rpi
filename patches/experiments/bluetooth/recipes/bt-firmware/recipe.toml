# Bluetooth firmware (patch RAM file) of the Pi 3B+ Wi-Fi/Bluetooth chip
# (CYW43455, Bluetooth part BCM4345C0), loaded by `bt up`. Downloaded at
# build time from pinned commits and checked; never kept in this
# repository (Cypress licence, see patches/experiments/bluetooth/README.md).
#
# Installed to /usr/lib/firmware/brcm/:
#   BCM4345C0.hcd                  the firmware, as Raspberry Pi OS ships it
#   BCM4345C0.LICENCE.cypress      its licence
[build]
template = "custom"
script = """
BLUEZFW=https://raw.githubusercontent.com/RPi-Distro/bluez-firmware/cdf61dc691a49ff01a124752bd04194907f0f9cd/debian/firmware/broadcom
LINUXFW=https://gitlab.com/kernel-firmware/linux-firmware/-/raw/20250311
fetch() {
    curl -sSfL --retry 3 -o "$2" "$1"
    echo "$3  $2" | sha256sum -c -
}
fetch "$BLUEZFW/BCM4345C0.hcd" BCM4345C0.hcd \
    51c45e77ddad91a19e96dc8fb75295b2087c279940df2634b23baf71b6dea42c
fetch "$LINUXFW/LICENCE.cypress" BCM4345C0.LICENCE.cypress \
    ae0db6cc4db33941148df0f67de53e76a77b1b5a46b3165edb7040aa2750015f
mkdir -p "${COOKBOOK_STAGE}/usr/lib/firmware/brcm"
cp BCM4345C0.hcd BCM4345C0.LICENCE.cypress "${COOKBOOK_STAGE}/usr/lib/firmware/brcm/"
"""
