# Experiment vc4d-flip (#188, stage a, test only): vc4d from branch flip, with
# a double-buffered primary plane; VC4D_MODE=write as in vc4d-mode-hdmi.
# Replaces experiment vc4d service file; build after --experiment vc4d.

[[files]]
path = "/usr/lib/init.d/15_vc4d.service"
data = """
[unit]
description = "VideoCore IV display: HVS planes (vc4d), double buffered, writing pixel valve 2 and the HDMI timing"
condition_architecture = ["aarch64"]

[service]
cmd = "vc4d"
inherit_envs = ["VC4D", "VC4D_FAKE", "VC4D_LOG", "VC4D_FLIP"]
envs = { VC4D_MODE = "write" }
type = "notify"
"""

# vc4d's trace (/etc/vc4d-trace) is off here: experiment vc4d-trace turns it on.
