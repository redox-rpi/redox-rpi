# Experiment orbital (#33): Redox's desktop, Orbital, on rpi-fbd. Same
# packages and start file as upstream's config/desktop-minimal.toml.
# Build together with --experiment rpi-fb.

[packages]
orbdata = {}
orbital = {}
# Built from source: opaque window (recipes/gui/orbterm/recipe.toml).
orbterm = "source"
orbutils = {}

# Orbital on VT 3, with the login window and then the launcher.
[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
requires_weak 10_net.target 20_audiod.service
nowait VT=3 orbital orblogin launcher
"""

# Stay on Orbital's VT instead of switching to the text console on VT 2.
[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = """
"""

# The launcher opens a terminal with Super-T, but asks for cosmic-term,
# which is large (iced) and not in this image. Give it orbterm instead.
[[files]]
path = "/usr/bin/cosmic-term"
data = "orbterm"
symlink = true

# Light desktop (#56): a plain colour instead of the background picture.
# Orbital fills the screen with background_color where no window is. The
# launcher still starts "background", which now only runs true and exits, so
# no full-screen picture window is composed on every redraw. Written after
# the packages (postinstall) to replace orbdata's and orbutils' files.
[[files]]
path = "/usr/share/ui/orbital.toml"
postinstall = true
data = """
cursor = "/usr/share/ui/left_ptr.png"
bottom_left_corner = "/usr/share/ui/bottom_left_corner.png"
bottom_right_corner = "/usr/share/ui/bottom_right_corner.png"
bottom_side = "/usr/share/ui/bottom_side.png"
left_side = "/usr/share/ui/left_side.png"
right_side = "/usr/share/ui/right_side.png"
window_max = "/usr/share/ui/window_max.png"
window_max_unfocused = "/usr/share/ui/window_max_unfocused.png"
window_close = "/usr/share/ui/window_close.png"
window_close_unfocused = "/usr/share/ui/window_close_unfocused.png"
background_color = { data = 0xFF2E3440 }
"""

[[files]]
path = "/usr/bin/background"
postinstall = true
mode = 0o755
data = """
#!/usr/bin/true
"""
