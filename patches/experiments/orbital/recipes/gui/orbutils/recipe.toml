# Experiment orbital (#616): orbutils built from source so that orblogin
# keeps its login picture only at window size (0001), not at full size plus
# a clone plus the scaled copy; its layout menu shows the layout set at
# boot (0002, #36). Upstream's recipe, pinned.
[source]
git = "https://gitlab.redox-os.org/redox-os/orbutils.git"
rev = "380995d3e29453dbc6e8a30b39fccf085b07f6ee"
patches = [
    "0001-orblogin-keep-the-login-picture-only-at-window-size.patch",
    "0002-orblogin-show-the-keyboard-layout-set-at-boot.patch",
]

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui"
cp -rv "${COOKBOOK_SOURCE}/apps" "${COOKBOOK_STAGE}/usr/share/ui/apps"

COOKBOOK_CARGO_PATH="orbutils" cookbook_cargo
COOKBOOK_CARGO_PATH="launcher" cookbook_cargo
"""
