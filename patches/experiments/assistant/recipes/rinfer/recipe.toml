# rinfer: Qwen3 GGUF inference in Rust with candle (Hugging Face), static,
# linked against our relibc. Test program for #43: loads the model, answers
# one prompt, prints the speed. candle's quantized NEON code needs the
# dotprod extension (SDOT), which the Pi 3's Cortex-A53 lacks:
# sdot-fallback.patch adds an exact NEON fallback. candle's Qwen3 loader
# turns the whole token table into f32 (622 MB) and reads it twice, which
# runs a 1 GiB Pi out of memory: qwen3-memory.patch keeps it quantized and
# dequantizes only the rows of the input tokens. It also lets
# CANDLE_KV_CACHE_LEN set the key/value cache's starting size; candle
# preallocates 4096 positions (900 MiB), rinfer starts with 256 and the
# cache grows by 64 instead of doubling; the cache is bf16 (half the
# memory); a whole prompt at once no longer keeps a second copy of it; the
# rotary tables cover 4096 positions instead of 40,960 (30 MiB less); the
# cache can be saved to a file and loaded again. redox-thread-pool.patch:
# candle's worker pool hung on Redox because a wakeup from thread::unpark
# was sometimes lost; idle workers there poll instead, yielding while work
# came in the last 100 ms (CANDLE_POOL_IDLE_MS), since a sleep lasts a
# whole 10 ms timer tick.
[source]
git = "https://github.com/huggingface/candle.git"
rev = "12bb5d1f6350f4ea9827d9086f213feec1f0af6a"
patches = ["sdot-fallback.patch", "qwen3-memory.patch", "redox-thread-pool.patch"]

[build]
template = "custom"
dependencies = ["relibc"]
script = """
rm -rf rinfer
cp -r "${COOKBOOK_RECIPE}/rinfer" rinfer
sed -i "s#\\.\\./candle/#${COOKBOOK_SOURCE}/#" rinfer/Cargo.toml
export RUSTFLAGS="${RUSTFLAGS} -L native=${COOKBOOK_SYSROOT}/lib -C target-cpu=cortex-a53"
"${COOKBOOK_CARGO}" install --locked --path rinfer --root "${COOKBOOK_STAGE}/usr" -j "${COOKBOOK_MAKE_JOBS}"
"""
