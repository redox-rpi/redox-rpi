[package]
name = "rinfer"
version = "0.1.0"
edition = "2021"

[dependencies]
candle = { package = "candle-core", path = "../candle/candle-core" }
candle-transformers = { path = "../candle/candle-transformers" }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
