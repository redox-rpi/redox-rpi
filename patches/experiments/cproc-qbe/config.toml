#include <stdalign.h>
#define T(x) _Generic((x), int: "int", double: "double", default: "other")
_Static_assert(sizeof(int) == 4, "int");
struct s { unsigned a:3, b:5; } v = { .b = 9, .a = 5 };
int main(void){ alignas(16) char c[4]; printf("%s %s %u %u %d\n", T(1), T(1.0), v.a, v.b, (int)((unsigned long)c % 16)); return 0; }
