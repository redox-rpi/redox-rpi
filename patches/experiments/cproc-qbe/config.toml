# Experiment cproc-qbe: cproc + QBE, a second C compiler on the Pi that
# optimises, with GNU as and ld. Build after experiment tcc: cproc
# preprocesses with tcc, and the checks use tcc-bench's sources.

[packages]
qbe = "source"
cproc = "source"
# as, ld, ar, ranlib, nm, objdump and strip only (this experiment's recipe).
binutils-gdb = "source"

# The cproc checks: `ion /usr/share/tcc-tests/cproc.ion`; "CPROC-TEST done"
# marks the end.
[[files]]
path = "/usr/share/tcc-tests/cproc.ion"
data = """
#!/usr/bin/ion
let T = /usr/share/tcc-tests
mkdir -p /tmp/cproc-test
cd /tmp/cproc-test
echo "== as, ld, qbe"
as --version | head -1
ld --version | head -1
echo "== hello (dynamic)"
timeit cproc -o hello $T/hello.c && timeit ./hello
echo "rc=$?"
echo "== hello (static)"
timeit cproc -static -o hello-static $T/hello.c ^> /tmp/cproc-static.err && timeit ./hello-static
head -4 /tmp/cproc-static.err
echo "== the steps: preprocess, cproc-qbe, qbe, as, ld"
timeit tcc -E -undef -nostdinc -isystem /usr/include -D__aarch64__ -D__redox__ -D__LP64__ -o bench.i $T/bench.c
timeit cproc -S -o bench.s $T/bench.c
timeit as -o bench.o bench.s
echo "== ar, ranlib, nm, objdump, strip"
cproc -c -o twice.o $T/twice.c
ar rc libtwice.a twice.o && ranlib libtwice.a
ar t libtwice.a
nm -s libtwice.a
objdump -d twice.o | grep -c "ret"
cproc -o usetwice $T/usetwice.c -L. -ltwice && ./usetwice
echo "rc=$?"
cp usetwice usetwice-stripped
strip usetwice-stripped && ./usetwice-stripped
echo "rc=$?"
ls -l usetwice usetwice-stripped
nm usetwice | grep twice
nm usetwice-stripped
echo "== bench, compiled by cproc"
timeit cproc -o bench $T/bench.c && timeit ./bench
echo "== bench, compiled by tcc"
timeit tcc -o bench-tcc $T/bench.c && timeit ./bench-tcc
echo "== bench, compiled by gcc -O2 (cross)"
timeit $T/bench-gcc
echo "CPROC-TEST done"
"""

# A small library for the ar/nm/objdump/strip check.
[[files]]
path = "/usr/share/tcc-tests/twice.c"
data = """
int twice(int x) { return 2 * x; }
"""

[[files]]
path = "/usr/share/tcc-tests/usetwice.c"
data = """
#include <stdio.h>
int twice(int x);
int main(void) { printf("twice(21) = %d\\n", twice(21)); return twice(21) == 42 ? 0 : 1; }
"""
