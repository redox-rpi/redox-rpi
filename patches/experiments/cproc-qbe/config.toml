data = '''
1 1.4142 0.8415
'''

[[files]]
path = "/usr/share/cproc-probes/run.ion"
data = '''
#!/usr/bin/ion
# cproc vs tcc language probes (#327). One line per probe and compiler.
let D = /usr/share/cproc-probes
mkdir -p /tmp/cproc-probes
cd /tmp/cproc-probes
for n in [asm longdouble vla tls complex gnu cgoto alloca c11 structabi attr math]
    for cc in [cproc tcc]
        if $cc -o $n-$cc $D/$n.c -lm -lpthread > $n-$cc.err ^> $n-$cc.err
            let out = "$(./$n-$cc ^> /dev/null)"
            if test "$out" = "$(cat $D/$n.want)"
                echo "PROBE $n $cc: pass"
            else
                echo "PROBE $n $cc: WRONG got [$out] want [$(cat $D/$n.want)]"
            end
        else
            echo "PROBE $n $cc: COMPILE-FAIL $(head -c 160 $n-$cc.err)"
        end
    end
end
echo "CPROC-PROBES done"
'''
