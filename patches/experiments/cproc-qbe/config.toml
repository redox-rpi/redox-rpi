[[files]]
path = "/usr/share/cproc-probes/structabi.c"
data = '''
#include <stdio.h>
#include <stdarg.h>
#include <stdlib.h>
struct big { long a, b, c; }; struct hfa { double x, y; };
struct big mk(long n){ struct big r = { n, n+1, n+2 }; return r; }
struct hfa h(struct hfa p){ p.x *= 2; return p; }
long sum(int n, ...){ va_list ap; va_start(ap, n); long s=0; for(int i=0;i<n;i++) s+=va_arg(ap,long); va_end(ap); return s; }
int cmp(const void *a, const void *b){ return *(int*)a - *(int*)b; }
int main(void){ struct big b = mk(1); struct hfa q = h((struct hfa){1.5, 2.5}); int v[] = {3,1,2}; qsort(v,3,sizeof v[0],cmp);
 div_t d = div(7,2); printf("%ld %ld %ld %g %g %ld %d%d%d %d %d %.3f\n", b.a,b.b,b.c,q.x,q.y,sum(4,1L,2L,3L,4L),v[0],v[1],v[2],d.quot,d.rem,3.14159); return 0; }
'''

[[files]]
path = "/usr/share/cproc-probes/structabi.want"
data = '''
1 2 3 3 2.5 10 123 3 1 3.142
'''

