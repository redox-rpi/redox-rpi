#include <stdio.h>
#include <math.h>
#include <setjmp.h>
jmp_buf jb;
int main(void){ volatile int n = 0; if (setjmp(jb) == 0) { n = 1; longjmp(jb, 1); } printf("%d %.4f %.4f\n", n, sqrt(2.0), sin(1.0)); return 0; }
'''

[[files]]
