# Redox image for the Raspberry Pi 3 Model B+, booted over the network
# (scripts/netboot.sh): the SD card image plus a development shell and the
# data partition of the network-boot SD card.
#
# Build with scripts/build-image.sh.

include = ["raspi3bp-sdcard.toml"]

[general]
# U-Boot loads the whole image into RAM, to at most 256 MiB
# (scripts/netboot.sh). The live bootloader comes over the network, so the
# EFI partition only needs to exist.
filesystem_size = 256
efi_partition_size = 32

[packages]
# Mounts the data partition below; the minimal config has it in initfs only.
redoxfs = {}
# Development shell over TCP port 2323 (tools/devshd), until SSH works.
devshd = "source"

# Mount the data partition of the network-boot SD card (scripts/make-sdcard.sh,
# always the second partition) at /scheme/data. Fails harmlessly without it.
# Not by UUID: `redoxfs --uuid` opens every partition for writing while it
# searches, including a root filesystem that is already mounted. And not as
# /data: Redox does not follow symlinks into another scheme.
[[files]]
path = "/usr/lib/init.d/60_data.service"
data = """
[unit]
description = "Data partition on the SD card"
requires_weak = ["00_base.target"]

[service]
cmd = "redoxfs"
args = ["/scheme/disk.mmc/0p1", "data"]
type = "oneshot"
"""

# Start the development shell. Unencrypted: for the home network only.
[[files]]
path = "/usr/lib/init.d/90_devshd.service"
data = """
[unit]
description = "Development shell on TCP port 2323"
requires_weak = ["10_net.target"]

[service]
cmd = "devshd"
type = "oneshot_async"
"""
