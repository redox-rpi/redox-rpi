# Redox image for the Raspberry Pi 3 Model B+.
#
# Build with scripts/build-image.sh. Kernel and base (drivers, init) are built
# from source with this repository's patches and BOARD=raspi3bp; everything
# else comes from Redox's prebuilt packages.

include = ["../upstream/redox/config/aarch64/raspi3bp/minimal.toml"]

[packages]
kernel = "source"
base = "source"
# Mounts the data partition below; the minimal config has it in initfs only.
redoxfs = {}

# Mount the data partition of the network-boot SD card (scripts/make-sdcard.sh,
# always the second partition) at /scheme/data. Fails harmlessly without it.
# Not by UUID: `redoxfs --uuid` opens every partition for writing while it
# searches, including a root filesystem that is already mounted. And not as
# /data: Redox does not follow symlinks into another scheme.
[[files]]
path = "/usr/lib/init.d/60_data.service"
data = """
[unit]
description = "Data partition on the SD card"
requires_weak = ["00_base.target"]

[service]
cmd = "redoxfs"
args = ["/scheme/disk.mmc/0p1", "data"]
type = "oneshot"
"""
