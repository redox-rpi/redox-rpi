# Redox image for the Raspberry Pi 3 Model B+ that boots from the SD card
# (scripts/make-sdcard.sh --local). Also the base of the network-boot image
# (config/raspi3bp.toml).
#
# Build with scripts/build-image.sh --sdcard. Kernel and base (drivers, init)
# are built from source with this repository's patches and BOARD=raspi3bp;
# everything else comes from Redox's prebuilt packages.

include = [
    "../upstream/redox/config/aarch64/raspi3bp/minimal.toml",
    # Version files, written by scripts/build-image.sh.
    "../build/redox-rpi-version.toml",
]

[general]
# Disk size in MiB, including the EFI partition. RedoxFS does not grow with
# the card. scripts/make-sdcard.sh copies the bootloader from the EFI
# partition (160 KiB), so it can be small.
filesystem_size = 1024
efi_partition_size = 32

[packages]
kernel = "source"
base = "source"
bootloader = "source"
# relibc: our fix for fork() on aarch64 (patches/relibc).
relibc = "source"
# `reboot` command (tools/reboot).
reboot = "source"
# `i2c` and `spi` commands for the I2C and SPI drivers (tools/i2c,
# tools/spi; base patches 0047 and 0048).
i2c = "source"
spi = "source"
# `socdump`: clock, PLL and GPIO registers, read-only (tools/socdump, #224).
socdump = "source"
# Programs beyond the minimal system, prebuilt by Redox. Most of them
# (bash, nano, vim, curl, wget, tmux, ripgrep, gawk, findutils) crash at
# start with today's prebuilt aarch64 packages, in QEMU too; see
# docs/status.md.
diffutils = {}
# `tone` writes test sound for /scheme/audio (tools/tone; base patch
# 0086, sound from the headphone jack, beta).
tone = "source"

# Startup sound (#292): `tone chime`, our own chord, plays once when audiod
# is up, in the background (oneshot_async), so the boot does not wait for
# it. `off` in /etc/startup-sound switches it off; the image says `on`.
# Network and direct boot run / from RAM, where /etc forgets: there a
# startup-sound file on the data partition (/scheme/data) wins. Those images
# have 60_data.service, so the script waits for the partition up to 5 s.
[[files]]
path = "/etc/startup-sound"
data = """
on
"""

[[files]]
path = "/usr/lib/startup-sound.ion"
data = """
let file = /etc/startup-sound
if test -f /usr/lib/init.d/60_data.service
    let n = 0
    while test ! -d /scheme/data && test $n -lt 5
        sleep 1
        let n += 1
    end
    if test -f /scheme/data/startup-sound
        let file = /scheme/data/startup-sound
    end
end
let state = on
if test -f $file
    let state = $(cat $file)
end
if test $state = off
    echo "startup-sound: off ($file)"
else if tone chime -a 0.5 > /scheme/audio
    echo "startup-sound: played"
else
    echo "startup-sound: failed"
end
"""

[[files]]
path = "/usr/lib/init.d/21_startup-sound.service"
data = """
[unit]
description = "Startup sound (off: write off to /etc/startup-sound)"
requires_weak = ["20_audiod.service"]

[service]
cmd = "ion"
args = ["/usr/lib/startup-sound.ion"]
type = "oneshot_async"
"""

# CPU clock at boot (#23): rpi-firmwared starts in the initfs, before /etc
# is there, with the ondemand governor. If /etc/rpi-firmware/governor
# exists, its word goes to the governor if it is `ondemand`, `performance`
# or `powersave`, else to arm_clock, so a rate in Hz (or `max`, `min`)
# keeps a fixed clock, like force_turbo=1 on Linux. rpi-firmwared logs what it set.
[[files]]
path = "/usr/lib/rpi-firmware/governor.ion"
data = """
# A mode goes to the governor, anything else (a rate, max, min) to arm_clock.
# Choosing first keeps the governor's refusal out of the log (Pi test 161:
# cat: /etc/rpi-firmware/governor: Invalid argument).
if test -f /etc/rpi-firmware/governor
    let mode = $(cat /etc/rpi-firmware/governor)
    match $mode
        case ondemand
            echo $mode > /scheme/rpi-firmware/governor
        case performance
            echo $mode > /scheme/rpi-firmware/governor
        case powersave
            echo $mode > /scheme/rpi-firmware/governor
        case _
            echo $mode > /scheme/rpi-firmware/arm_clock
    end
else
    # No file: keep the ondemand governor; init counts status 1 as failed.
    true
end
"""

[[files]]
path = "/usr/lib/init.d/15_rpi-governor.service"
data = """
[unit]
description = "CPU clock setting from /etc/rpi-firmware/governor"
requires_weak = ["00_base.target"]

[service]
cmd = "ion"
args = ["/usr/lib/rpi-firmware/governor.ion"]
type = "oneshot"
"""
