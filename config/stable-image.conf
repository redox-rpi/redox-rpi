# Options for scripts/build-image.sh when scripts/update-stable.sh builds the
# nightly stable network-boot image (pi-tests lab.md, "Stable image").
# The SD card driver is bcm2835-sdhostd, the default since base patch 0027 (#6).
# usb-port-power: without it the devsh reset before the test loses USB (and
# with it the network) on 30-40 % of boots (#576); the release images carry it.
--experiment timesync
--experiment rtl8152
--experiment usb-port-power
