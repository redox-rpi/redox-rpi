# dnsmasq as a proxy DHCP server for the Pi 3B+ firmware network boot
# (scripts/netboot-firmware.sh, docs/netboot.md "Without SD card").
#
# The router stays the DHCP server and hands out the addresses. dnsmasq only
# adds the PXE answer the Pi boot ROM waits for: "Raspberry Pi Boot" and this
# host as the TFTP server. It answers PXE clients only, and of those only Pi
# network adapters, so other devices, U-Boot and Redox are not affected.
# tftpd-hpa keeps serving TFTP.

# No DNS server, no TFTP server.
port=0

# Proxy mode for this LAN: change to your network address.
dhcp-range=192.168.178.0,proxy

# Raspberry Pi Foundation MAC prefixes (Pi 3B+: b8:27:eb).
dhcp-mac=set:rpi,b8:27:eb:*:*:*
dhcp-mac=set:rpi,dc:a6:32:*:*:*
dhcp-mac=set:rpi,e4:5f:01:*:*:*
pxe-service=tag:rpi,0,"Raspberry Pi Boot"

log-dhcp
