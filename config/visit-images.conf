# Images for tests with a person at the Pi ("visit" images), built every
# night after the stable image by scripts/build-visit-images.sh
# (docs/topics/ci.md, "Nightly visit images").
#
# One image per line:
#   <name> <owner topic> [ref=<branch>] [clean=<path>] [--sdcard] <build-image.sh options>
#
#   name     directory under /srv/tftp/visit/ and part of the SD image name
#   owner    topic page that owns the image (docs/topics/<owner>.md)
#   ref=     build the newest commit of origin/<branch>, a branch of
#            redox-rpi/redox-rpi, instead of the commit of the stable image;
#            drop it once the branch is merged
#   clean=   recipes/<path>: upstream/redox/recipes/<path> is removed before
#            the build (a recipe whose stale source blocks its checkout);
#            other paths are refused
#   --sdcard also build the SD card image and put it into /srv/tftp/sdcard/;
#            add it where the image can boot from the card, else say why not
#            in a comment at the end of the line (shown on the index page)
#
# A test row in the test queue (queue.md in redox-rpi/pi-tests) that writes "nightly visit `<name>`" in its
# Image column is listed with the image on http://homenodellm:8080/visit/.
#
# Latest time (UTC) a build may run; a build still running then is stopped.
deadline 07:00

# The v0.5.0 desktop (Orbital on rpi-fbd, Sopwith, COSMIC apps from source,
# tcc) on the stable image's commit, as in the release options. vc4d rows
# bring their own images (graphics, ~/redox-rpi-graphics/keep/).
desktop graphics --sdcard --experiment timesync --experiment rpi-fb --experiment orbital --experiment orbital-apps --experiment cosmic-apps-source --experiment desktop --experiment tcc
