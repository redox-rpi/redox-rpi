# Images for tests with a person at the Pi ("visit" images), built every
# night after the stable image by scripts/build-visit-images.sh
# (docs/topics/ci.md, "Nightly visit images").
#
# One image per line:
#   <name> <owner topic> [ref=<branch>] [clean=<path>] [--sdcard] <build-image.sh options>
#
#   name     directory under /srv/tftp/visit/ and part of the SD image name
#   owner    topic page that owns the image (docs/topics/<owner>.md)
#   ref=     build the newest commit of origin/<branch> instead of the commit
#            of the stable image; drop it once the branch is merged
#   clean=   path under upstream/redox/ removed before the build (a recipe
#            whose stale source blocks its checkout)
#   --sdcard also build the SD card image and put it into /srv/tftp/sdcard/
#
# Latest time (UTC) a build may run; a build still running then is stopped.
deadline 07:00

# Row 204 (#33): the desktop, Orbital on vc4d.
desktop graphics ref=graphics-vc4d clean=recipes/other/vc4d --experiment timesync --experiment orbital --experiment usb-mouse --experiment orbital-apps --experiment vc4d
