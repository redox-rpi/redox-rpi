# Pins of the nightly TinyCC VC4 track (#410, WBS 2.15 point 3), read by
# scripts/tcc-track.sh and written into each night's record. Change them by
# pull request, like config/upstream.lock.

# redox-rpi/tinycc: vc4-tcc and the vc4 tests. 690da973 is vc4 73d65d06
# plus the first CI files of redox-rpi/tinycc PR #5; move to the vc4 branch
# once that is merged.
TINYCC_REV=690da973
# redox-rpi/rpi-open-firmware branch fat-boot (not m3-mbox): the bootcode
