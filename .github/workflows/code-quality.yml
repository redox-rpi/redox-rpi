name: Code quality

# Static checks for our own tools and scripts (#273, targets in the QMP).
# Gating: pyflakes on every Python file, cargo test for the tool crates
# with host tests. Report-only (step summary, never fails the job):
# shellcheck, clippy with undocumented_unsafe_blocks, cppcheck, ruff.
# A report-only check becomes gating once it is at 0 on main.
# Drivers and patches built only for aarch64-unknown-redox are checked
# after the nightly instead (#272).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gating:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: pyflakes
        run: |
          pip install --quiet pyflakes==3.2.0
          git ls-files -z '*.py' | xargs -0 python3 -m pyflakes
      - name: cargo test (tool crates with host tests)
        run: |
          for crate in assistant cputop socdump timerd timesync welcome; do
              echo "::group::$crate"
              (cd "tools/$crate" && cargo test --quiet)
              echo "::endgroup::"
          done

  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck cppcheck
          pip install --quiet ruff==0.6.9
          rustup component add clippy
      - name: Report (never fails)
        run: |
          set +e
          sum="$GITHUB_STEP_SUMMARY"
          echo "## Code quality (report-only)" >> "$sum"
          echo "" >> "$sum"
          echo "| Check | Findings |" >> "$sum"
          echo "|---|---|" >> "$sum"
          sc="$(git ls-files -z '*.sh' | xargs -0 shellcheck -f gcc 2>/dev/null)"
          echo "| shellcheck errors | $(grep -c ': error:' <<< "$sc") |" >> "$sum"
          echo "| shellcheck warnings | $(grep -c ': warning:' <<< "$sc") |" >> "$sum"
          rf="$(ruff check --select E,F,W,B --ignore E501 --output-format concise $(git ls-files '*.py') 2>/dev/null)"
          echo "| ruff E/F/W/B (no E501) | $(grep -c ':[0-9]*:[0-9]*: ' <<< "$rf") |" >> "$sum"
          cp="$(cppcheck --quiet --enable=warning,portability --template='{file}:{line}: {severity}: {message}' $(git ls-files '*.c') 2>&1)"
          echo "| cppcheck | $(grep -c ': ' <<< "$cp") |" >> "$sum"
          total=0; unsafe=0; rows=""
          for toml in tools/*/Cargo.toml; do
              dir="$(dirname "$toml")"; crate="$(basename "$dir")"
              # rpi-boot-stub builds only for aarch64-unknown-none
              [ "$crate" = rpi-boot-stub ] && continue
              out="$(cd "$dir" && cargo clippy --quiet --message-format short -- -W clippy::undocumented_unsafe_blocks 2>&1)"
              w="$(grep -c ': warning: ' <<< "$out")"
              u="$(grep -c 'undocumented_unsafe_blocks\|unsafe block missing a safety comment' <<< "$out")"
              total=$((total + w)); unsafe=$((unsafe + u))
              [ "$w" -gt 0 ] && rows="$rows\n| $crate | $w | $u |"
          done
          echo "| clippy warnings (tools/*) | $total |" >> "$sum"
          echo "| unsafe blocks without SAFETY: (tools/*) | $unsafe |" >> "$sum"
          echo "" >> "$sum"
          if [ -n "$rows" ]; then
              echo "| Crate | clippy warnings | of them undocumented unsafe |" >> "$sum"
              echo "|---|---|---|" >> "$sum"
              printf "%b\n" "${rows#\\n}" >> "$sum"
          fi
          echo "" >> "$sum"
          echo "<details><summary>shellcheck, ruff, cppcheck output</summary>" >> "$sum"
          echo "" >> "$sum"
          printf '```text\n%s\n%s\n%s\n```\n' "$sc" "$rf" "$cp" | head -c 60000 >> "$sum"
          echo "</details>" >> "$sum"
          exit 0
