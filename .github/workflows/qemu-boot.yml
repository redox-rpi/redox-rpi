name: QEMU boot test

# Builds the latest upstream Redox kernel with this repository's patches and
# boots it with the latest daily server image in QEMU's Raspberry Pi 3 machine.
# Runs daily as well, to notice upstream changes that break the Pi.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  raspi3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm zstd

      - name: Build kernel
        run: scripts/build-kernel.sh

      - name: Build redoxfs-file
        run: cargo build --release --manifest-path tools/redoxfs-file/Cargo.toml

      - name: Boot in QEMU raspi3b
        run: |
          scripts/qemu-raspi3b.sh --test --timeout 2400 \
            --kernel upstream/kernel/build/aarch64/kernel \
            --expect "irq_bcm2836:INFO" \
            --expect "CPU activation complete: 4 CPUs online" \
            --expect "redox login:"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-raspi3b-log
          path: images/qemu-test.log
