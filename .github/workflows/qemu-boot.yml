name: QEMU boot test

# Checks that all patches apply to the upstream commits pinned in
# config/upstream.lock, builds the pinned kernel with our patches and boots it
# with the latest daily server image in QEMU's Raspberry Pi 3 machine.
# upstream-weekly.yml does the same with the latest upstream sources.
# The full image from the pinned sources is built and tested on the real Pi
# every night on the build host (scripts/update-stable.sh).

# Documentation alone does not change what boots: a push or pull request that
# only touches Markdown or docs/ starts no run (the runner takes one job at a
# time, and release days push many docs commits). No status check is required
# on main, so a skipped pull request is not blocked.
#
# Only changes to what this job checks start a run (#730): patches,
# configs, our tools and recipes, and the scripts the job calls. Host-only
# scripts (pi-test.py, update-stable.sh, the nightly and report tools) and
# Markdown start none.
on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "config/**"
      - "tools/**"
      - "scripts/build-image.sh"
      - "scripts/build-kernel.sh"
      - "scripts/build-uboot.sh"
      - "scripts/check-patches.sh"
      - "scripts/qemu-raspi3b.sh"
      - "scripts/fw-direct-boot.sh"
      - "scripts/make-sdcard.sh"
      - "scripts/netboot.sh"
      - "scripts/netboot-firmware.sh"
      - "scripts/lab-env.sh"
      - "scripts/with-build-lock.sh"
      - "scripts/kconfig/**"
      - ".github/workflows/qemu-boot.yml"
      - "!**.md"
  pull_request:
    paths:
      - "patches/**"
      - "config/**"
      - "tools/**"
      - "scripts/build-image.sh"
      - "scripts/build-kernel.sh"
      - "scripts/build-uboot.sh"
      - "scripts/check-patches.sh"
      - "scripts/qemu-raspi3b.sh"
      - "scripts/fw-direct-boot.sh"
      - "scripts/make-sdcard.sh"
      - "scripts/netboot.sh"
      - "scripts/netboot-firmware.sh"
      - "scripts/lab-env.sh"
      - "scripts/with-build-lock.sh"
      - "scripts/kconfig/**"
      - ".github/workflows/qemu-boot.yml"
      - "!**.md"
  workflow_dispatch:

# A newer push cancels the run before it: on main only the newest commit is
# tested, in a pull request only its newest head (#730; ci-main-red.yml
# ignores cancelled runs). Manual runs each get their own group and are
# never cancelled.
concurrency:
  group: qemu-boot-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  raspi3b:
    # Our own runner on the build host (label homenode, docs/build-host.md
    # "CI runner") once the maintainer turns it on with the repository variable
    # HOMENODE_RUNNER=on; only for pushes, the schedule and pull requests
    # from branches of this repository. Pull requests from forks always run
    # on GitHub's runners.
    runs-on: ${{ vars.HOMENODE_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'homenode' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and tools
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm zstd

      # Pull requests: also against the base, so a change that breaks an
      # experiment which applies on the base fails here (#672). Parked
      # experiments (patches/experiments/parked.txt) never fail.
      - name: Check patches on the pinned commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-patches.sh ${BASE_SHA:+--base "$BASE_SHA"}

      # The QEMU boot test builds only the kernel: this catches a recipe list
      # that a full image build would stop at (#394: patches/u-boot taken for
      # a Redox recipe). Seconds, no cooking.
      - name: Recipe list of build-image.sh (default and each experiment)
        run: |
          scripts/build-image.sh --recipes-only
          for exp in patches/experiments/*/; do
            scripts/build-image.sh --recipes-only --no-test-experiments \
              --experiment "$(basename "$exp")" > /dev/null
          done

      # Pull requests: whether the patches still apply to the newest upstream,
      # report only (a few seconds). The kernel build and boot on the newest
      # upstream run weekly and on pull requests that change the kernel side
      # (upstream-weekly.yml, #730).
      - name: Patches on the latest upstream (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          scripts/check-patches.sh --latest --work build/check-patches-latest ||
            echo "::warning title=Latest upstream::patches do not apply to the newest upstream (see the job summary); the pinned check decides"

      - name: Build kernel (pinned commit)
        run: scripts/build-kernel.sh

      - name: Build redoxfs-file
        run: cargo build --release --manifest-path tools/redoxfs-file/Cargo.toml

      - name: Build our U-Boot
        # Redox's prebuilt U-Boot on gitlab.redox-os.org answers GitHub's
        # runners with 403 since 2026-11-13 (#409); ours is what the Pi runs.
        env:
          UBOOT_REPO: https://github.com/u-boot/u-boot.git
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu bison flex bc \
              swig libssl-dev libgnutls28-dev python3-pyelftools device-tree-compiler
          fi
          scripts/build-uboot.sh rpi

      - name: Newest image in our mirror
        # latest.txt in release ci-image names the newest copy;
        # scripts/refresh-ci-image.py refreshes it weekly. Falls back to the
        # copy of 2026-11-11 while latest.txt does not exist yet.
        run: |
          name=$(curl -fsSL https://github.com/redox-rpi/redox-rpi/releases/download/ci-image/latest.txt || true)
          echo "DAILY_IMAGE=${name:-redox_server_aarch64_2026-11-11_584_livedisk.iso.zst}" >> "$GITHUB_ENV"

      - name: Boot in QEMU raspi3b
        # Redox's daily image from our mirror (release ci-image, #409):
        # static.redox-os.org answers GitHub's runners with 403.
        env:
          DAILY_URL: https://github.com/redox-rpi/redox-rpi/releases/download/ci-image
        run: |
          scripts/qemu-raspi3b.sh --daily --test --uboot ours --timeout 2400 --usb-net \
            --kernel upstream/kernel/build/aarch64/kernel \
            --expect "irq_bcm2836:INFO" \
            --expect "CPU activation complete: 4 CPUs online" \
            --expect "redox login:"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-raspi3b-log
          path: images/qemu-test.log
