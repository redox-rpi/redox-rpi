# Firmware, regulatory data and board settings of the Wi-Fi chips, for
# bcm2835-sdiod: the Pi 3B+ (CYW43455) and the Pi Zero 2 W (CYW43436 or
# CYW43436S, depending on the board). Downloaded at build time from pinned
# commits and checked; never kept in this repository (Cypress and Broadcom
# licences, see patches/experiments/wifi-sdio/README.md).
#
# Installed to /usr/lib/firmware/brcm/:
#   cyfmac43455-sdio-minimal.bin   firmware with the in-chip WPA supplicant
#   cyfmac43455-sdio-standard.bin  firmware Raspberry Pi OS uses
#   cyfmac43455-sdio.clm_blob      regulatory data
#   brcmfmac43455-sdio.raspberrypi,3-model-b-plus.txt  NVRAM (board settings)
#   brcmfmac43436-sdio.bin, .clm_blob, .txt   Zero 2 W with a CYW43436
#                                  (Raspberry Pi OS links the board names
#                                  ...raspberrypi,model-zero-2-w.* to these)
#   brcmfmac43436s-sdio.bin, .txt  Zero 2 W with a CYW43436S (no CLM file)
#   LICENCE.cypress, LICENCE.broadcom_bcm43xx
[build]
template = "custom"
script = """
NONFREE=https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/c91cd2804cf7463aab913e7247c176049f16bbd6/debian/config/brcm80211
# The Zero 2 W files, from a later commit (2026-11-23).
ZERO=https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/b1833f18a816cf8fd73ca86e27f9eecea11bf991/debian/added-firmware/brcm
LINUXFW=https://gitlab.com/kernel-firmware/linux-firmware/-/raw/20250311
fetch() {
    curl -sSfL --retry 3 -o "$2" "$1"
    echo "$3  $2" | sha256sum -c -
}
fetch "$NONFREE/cypress/cyfmac43455-sdio-minimal.bin" cyfmac43455-sdio-minimal.bin \
    3075cb0bdc4b28ed4f08e01b1a216d0ebc70f4022d9d3272a4a43b3c90456e60
fetch "$NONFREE/cypress/cyfmac43455-sdio-standard.bin" cyfmac43455-sdio-standard.bin \
    d608f866582519c0a28d86db43040f4f1b98dd1d153e72e9752586546b4a36c3
fetch "$NONFREE/cypress/cyfmac43455-sdio.clm_blob" cyfmac43455-sdio.clm_blob \
    9823842cae9fb9a5dd1e5fb31f595516ec7deee341354bef30bb3026eee29cc1
# The board file for the 3B+ is a link to this one.
fetch "$NONFREE/brcm/brcmfmac43455-sdio.txt" "brcmfmac43455-sdio.raspberrypi,3-model-b-plus.txt" \
    ca709be81a78bdb6932936374f39943acbd7af07fae6151011127599a3ce9e3d
fetch "$ZERO/brcmfmac43436-sdio.bin" brcmfmac43436-sdio.bin \
    1e939eda94c125d164091b4dbd559f26101bc5640cc3af382feb9a8aaec5945e
fetch "$ZERO/brcmfmac43436-sdio.clm_blob" brcmfmac43436-sdio.clm_blob \
    fce7cbb62ffa6a5a65ca97b13f6fbf28d06c02d986c2072d65bf72164755fc34
fetch "$ZERO/brcmfmac43436-sdio.txt" brcmfmac43436-sdio.txt \
    4cda90facd8844cff60d80b34b24ecbae76adb9a62508a109461b8bf42b478d1
fetch "$ZERO/brcmfmac43436s-sdio.bin" brcmfmac43436s-sdio.bin \
    68b9bcc9855d91733cd44c21de4cb507c91b0d32d838c0696def5eb96c99e2de
fetch "$ZERO/brcmfmac43436s-sdio.txt" brcmfmac43436s-sdio.txt \
    37a8b85a5a9742761101b764a07bc4d0c8b09f2e180eaea3b503a834277ad595
fetch "$LINUXFW/LICENCE.cypress" LICENCE.cypress \
    ae0db6cc4db33941148df0f67de53e76a77b1b5a46b3165edb7040aa2750015f
fetch "$LINUXFW/LICENCE.broadcom_bcm43xx" LICENCE.broadcom_bcm43xx \
    b16056fc91b82a0e3e8de8f86c2dac98201aa9dc3cbd33e8d38f1b087fcec30d
mkdir -p "${COOKBOOK_STAGE}/usr/lib/firmware/brcm"
# Named one by one: a pattern like cyfmac43455-sdio-* missed the .clm_blob (#77).
cp cyfmac43455-sdio-minimal.bin cyfmac43455-sdio-standard.bin cyfmac43455-sdio.clm_blob \
    "brcmfmac43455-sdio.raspberrypi,3-model-b-plus.txt" \
    brcmfmac43436-sdio.bin brcmfmac43436-sdio.clm_blob brcmfmac43436-sdio.txt \
    brcmfmac43436s-sdio.bin brcmfmac43436s-sdio.txt \
    LICENCE.cypress LICENCE.broadcom_bcm43xx \
    "${COOKBOOK_STAGE}/usr/lib/firmware/brcm/"
"""
