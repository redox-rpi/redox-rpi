[package]
name = "pointer-bench"
description = "Moves the mouse pointer (and optionally drags a window) through inputd at a fixed rate, to measure what pointer and window moves cost"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
inputd = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "eddcaa21fb2d11b4a6bd64478e0639153266dc04" }
orbclient = { version = "0.4.6", default-features = false }
