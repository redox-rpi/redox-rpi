[package]
name = "mqtt"
description = "A small MQTT 3.1.1 client library and the tools mqtt-pub, mqtt-sub and ha-bridge, for Redox"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["tls"]
# MQTT over TLS (port 8883). Without it the crate needs only std.
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

# ring with Redox support, as Redox' pkgutils uses.
[patch.crates-io]
ring = { git = "https://gitlab.redox-os.org/redox-os/ring.git", branch = "redox-0.17.16" }
