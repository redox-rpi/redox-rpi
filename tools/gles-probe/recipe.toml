# The [build] part of the recipe; scripts/build-image.sh adds [source].
# gles-probe (#669): OpenGL ES 2.0 off-screen through EGL's surfaceless
# platform. Linked dynamically: Mesa loads its drivers (v3d_dri.so) with
# dlopen, so EGL and GLES come as shared libraries.
[build]
template = "custom"
dependencies = ["mesa"]
script = """
DYNAMIC_INIT
"${CC}" ${CFLAGS} ${CPPFLAGS} "-I${COOKBOOK_SYSROOT}/include" -O2 -Wall \\
    -o gles-probe "${COOKBOOK_SOURCE}/gles-probe.c" ${LDFLAGS} -lEGL -lGLESv2
mkdir -p "${COOKBOOK_STAGE}/usr/bin"
cp gles-probe "${COOKBOOK_STAGE}/usr/bin/gles-probe"
"""
